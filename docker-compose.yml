x-go-build: &go-build
  context: .
  dockerfile: Dockerfile
  target: golang-runtime

x-go-environment: &go-environment
  OGAME_ENV: ${OGAME_ENV:-development}
  OGAME_LOG_LEVEL: ${OGAME_LOG_LEVEL:-info}
  TZ: UTC
  OGAME_HTTP_ADDR: :8080
  OGAME_LEGACY_BASE_URL: ${OGAME_LEGACY_BASE_URL:-http://localhost:8888}
  OGAME_LEGACY_GAME_DIR: /srv/ogame/game
  OGAME_PUBLIC_UNIVERSES: ${OGAME_PUBLIC_UNIVERSES:-}
  OGAME_MCP_STATIC_TOKENS: ${OGAME_MCP_STATIC_TOKENS:-}
  OGAME_MCP_OAUTH_REDIRECT_URIS: ${OGAME_MCP_OAUTH_REDIRECT_URIS:-}
  OGAME_MCP_OIDC_ED25519_SEED_B64: ${OGAME_MCP_OIDC_ED25519_SEED_B64:-}
  OGAME_MCP_OIDC_ED25519_PREVIOUS_SEEDS_B64: ${OGAME_MCP_OIDC_ED25519_PREVIOUS_SEEDS_B64:-}
  OGAME_MCP_TOKEN_TTL_SECONDS: ${OGAME_MCP_TOKEN_TTL_SECONDS:-2592000}
  OGAME_MCP_RATE_LIMIT_ENABLE: ${OGAME_MCP_RATE_LIMIT_ENABLE:-1}
  OGAME_MCP_RATE_LIMIT_PER_MINUTE: ${OGAME_MCP_RATE_LIMIT_PER_MINUTE:-300}
  OGAME_MCP_RATE_LIMIT_BURST: ${OGAME_MCP_RATE_LIMIT_BURST:-60}
  OGAME_SMTP_ADDR: ${OGAME_SMTP_ADDR:-mailhog:1025}
  OGAME_SMTP_FROM: ${OGAME_SMTP_FROM:-OGame <noreply@localhost>}
  OGAME_UNI_DB_PREFIX: ${OGAME_UNI_DB_PREFIX:-uni1_}
  OGAME_UNI_DB_SECRET: ${OGAME_UNI_DB_SECRET:-docker-secret}
  OGAME_UNI_NUMBER: ${OGAME_UNI_NUMBER:-${OGAME_UNI_NUM:-1}}
  OGAME_UNI_LANG: ${OGAME_UNI_LANG:-en}
  OGAME_UNI_SPEED: ${OGAME_UNI_SPEED:-1}
  OGAME_UNI_FLEET_SPEED: ${OGAME_UNI_FLEET_SPEED:-1}
  OGAME_UNI_GALAXIES: ${OGAME_UNI_GALAXIES:-9}
  OGAME_UNI_SYSTEMS: ${OGAME_UNI_SYSTEMS:-499}
  OGAME_UNI_MAX_USERS: ${OGAME_UNI_MAX_USERS:-12500}
  OGAME_UNI_START_DM: ${OGAME_UNI_START_DM:-0}
  OGAME_UNI_ACS: ${OGAME_UNI_ACS:-4}
  OGAME_UNI_FID: ${OGAME_UNI_FID:-30}
  OGAME_UNI_DID: ${OGAME_UNI_DID:-0}
  OGAME_UNI_RAPID: ${OGAME_UNI_RAPID:-1}
  OGAME_UNI_MOONS: ${OGAME_UNI_MOONS:-1}
  OGAME_UNI_BATTLE_ENGINE: ${OGAME_UNI_BATTLE_ENGINE:-../cgi-bin/battle}
  OGAME_UNI_PHP_BATTLE: ${OGAME_UNI_PHP_BATTLE:-1}
  OGAME_UNI_BATTLE_MAX: ${OGAME_UNI_BATTLE_MAX:-1000000}
  OGAME_UNI_FORCE_LANG: ${OGAME_UNI_FORCE_LANG:-0}
  OGAME_UNI_MAX_WERF: ${OGAME_UNI_MAX_WERF:-999}
  OGAME_UNI_FEED_AGE: ${OGAME_UNI_FEED_AGE:-60}
  OGAME_EXT_BOARD: ${OGAME_EXT_BOARD:-}
  OGAME_EXT_DISCORD: ${OGAME_EXT_DISCORD:-}
  OGAME_EXT_TUTORIAL: ${OGAME_EXT_TUTORIAL:-}
  OGAME_EXT_RULES: ${OGAME_EXT_RULES:-}
  OGAME_EXT_IMPRESSUM: ${OGAME_EXT_IMPRESSUM:-}
  OGAME_DB_MAX_OPEN_CONNS: ${OGAME_DB_MAX_OPEN_CONNS:-25}
  OGAME_DB_MAX_IDLE_CONNS: ${OGAME_DB_MAX_IDLE_CONNS:-5}
  OGAME_DB_CONN_MAX_LIFETIME_SECONDS: ${OGAME_DB_CONN_MAX_LIFETIME_SECONDS:-1800}
  OGAME_QUEUE_POLL_INTERVAL_MS: ${OGAME_QUEUE_POLL_INTERVAL_MS:-1000}

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: legacy
    environment:
      OGAME_AUTO_INSTALL: ${OGAME_AUTO_INSTALL:-1}
      TZ: UTC
      OGAME_MDB_HOST: ${OGAME_MDB_HOST:-mysql}
      OGAME_MDB_USER: ${OGAME_MDB_USER:-root}
      OGAME_MDB_PASS: ${OGAME_MDB_PASS:-${MYSQL_ROOT_PASSWORD:-123}}
      OGAME_MDB_NAME: ${OGAME_MDB_NAME:-master}
      OGAME_UNI_AUTO_INSTALL: ${OGAME_UNI_AUTO_INSTALL:-${OGAME_AUTO_INSTALL:-1}}
      OGAME_UNI_URL: ${OGAME_UNI_URL:-localhost:8888}
      OGAME_STARTPAGE: ${OGAME_STARTPAGE:-http://localhost:8888}
      OGAME_UNI_DB_HOST: ${OGAME_UNI_DB_HOST:-mysql}
      OGAME_UNI_DB_USER: ${OGAME_UNI_DB_USER:-root}
      OGAME_UNI_DB_PASS: ${OGAME_UNI_DB_PASS:-${MYSQL_ROOT_PASSWORD:-123}}
      OGAME_UNI_DB_NAME: ${OGAME_UNI_DB_NAME:-uni}
      OGAME_UNI_DB_PREFIX: ${OGAME_UNI_DB_PREFIX:-uni1_}
      OGAME_UNI_DB_SECRET: ${OGAME_UNI_DB_SECRET:-docker-secret}
      OGAME_UNI_MDB_ENABLE: ${OGAME_UNI_MDB_ENABLE:-1}
      OGAME_UNI_LANG: ${OGAME_UNI_LANG:-en}
      OGAME_UNI_NUM: ${OGAME_UNI_NUM:-${OGAME_UNI_NUMBER:-1}}
      OGAME_UNI_SPEED: ${OGAME_UNI_SPEED:-1}
      OGAME_UNI_FLEET_SPEED: ${OGAME_UNI_FLEET_SPEED:-1}
      OGAME_UNI_GALAXIES: ${OGAME_UNI_GALAXIES:-9}
      OGAME_UNI_SYSTEMS: ${OGAME_UNI_SYSTEMS:-499}
      OGAME_UNI_MAX_USERS: ${OGAME_UNI_MAX_USERS:-12500}
      OGAME_UNI_START_DM: ${OGAME_UNI_START_DM:-0}
      OGAME_UNI_ACS: ${OGAME_UNI_ACS:-4}
      OGAME_UNI_FID: ${OGAME_UNI_FID:-30}
      OGAME_UNI_DID: ${OGAME_UNI_DID:-0}
      OGAME_UNI_RAPID: ${OGAME_UNI_RAPID:-1}
      OGAME_UNI_MOONS: ${OGAME_UNI_MOONS:-1}
      OGAME_UNI_BATTLE_ENGINE: ${OGAME_UNI_BATTLE_ENGINE:-../cgi-bin/battle}
      OGAME_UNI_PHP_BATTLE: ${OGAME_UNI_PHP_BATTLE:-1}
      OGAME_UNI_BATTLE_MAX: ${OGAME_UNI_BATTLE_MAX:-1000000}
      OGAME_UNI_FORCE_LANG: ${OGAME_UNI_FORCE_LANG:-0}
      OGAME_UNI_MAX_WERF: ${OGAME_UNI_MAX_WERF:-999}
      OGAME_UNI_FEED_AGE: ${OGAME_UNI_FEED_AGE:-60}
      OGAME_EXT_BOARD: ${OGAME_EXT_BOARD:-}
      OGAME_EXT_DISCORD: ${OGAME_EXT_DISCORD:-}
      OGAME_EXT_TUTORIAL: ${OGAME_EXT_TUTORIAL:-}
      OGAME_EXT_RULES: ${OGAME_EXT_RULES:-}
      OGAME_EXT_IMPRESSUM: ${OGAME_EXT_IMPRESSUM:-}
      OGAME_ADMIN_EMAIL: ${OGAME_ADMIN_EMAIL:-admin@example.local}
      OGAME_ADMIN_PASSWORD: ${OGAME_ADMIN_PASSWORD:-admin}
    ports:
      - "${OGAME_LEGACY_PORT:-8888}:80"
    volumes:
      - web_configs:/var/www/html/persistent_configs
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started

  goapp:
    profiles: [golang]
    build: *go-build
    environment:
      <<: *go-environment
      OGAME_DB_DRIVER: mysql
      OGAME_PUBLIC_BASE_URL: ${OGAME_PUBLIC_BASE_URL:-http://localhost:${OGAME_GO_PORT:-8890}}
      OGAME_SMTP_ENABLE: ${OGAME_SMTP_ENABLE:-1}
      OGAME_MASTER_DB_ENABLE: ${OGAME_MASTER_DB_ENABLE:-1}
      OGAME_MDB_HOST: ${OGAME_MDB_HOST:-mysql}
      OGAME_MDB_USER: ${OGAME_MDB_USER:-root}
      OGAME_MDB_PASS: ${OGAME_MDB_PASS:-${MYSQL_ROOT_PASSWORD:-123}}
      OGAME_MDB_NAME: ${OGAME_MDB_NAME:-master}
      OGAME_UNI_DB_ENABLE: ${OGAME_UNI_DB_ENABLE:-1}
      OGAME_UNI_DB_HOST: ${OGAME_UNI_DB_HOST:-mysql}
      OGAME_UNI_DB_USER: ${OGAME_UNI_DB_USER:-root}
      OGAME_UNI_DB_PASS: ${OGAME_UNI_DB_PASS:-${MYSQL_ROOT_PASSWORD:-123}}
      OGAME_UNI_DB_NAME: ${OGAME_UNI_DB_NAME:-uni}
    ports:
      - "${OGAME_GO_PORT:-8890}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck: &go-healthcheck
      test: [CMD, wget, -q, -O, "-", http://localhost:8080/api/healthz]
      interval: 5s
      timeout: 3s
      retries: 12

  goapp-sqlite:
    profiles: [sqlite]
    build: *go-build
    environment:
      <<: *go-environment
      OGAME_DB_DRIVER: sqlite
      OGAME_SQLITE_MASTER_PATH: /srv/ogame/data/master.sqlite
      OGAME_SQLITE_UNIVERSE_PATH: /srv/ogame/data/universe.sqlite
      OGAME_SQLITE_AUTO_MIGRATE: ${OGAME_SQLITE_AUTO_MIGRATE:-1}
      OGAME_UNI_DB_SECRET: ${OGAME_UNI_DB_SECRET:-sqlite-secret}
      OGAME_ADMIN_EMAIL: ${OGAME_ADMIN_EMAIL:-admin@example.local}
      OGAME_ADMIN_PASSWORD: ${OGAME_ADMIN_PASSWORD:-admin}
      OGAME_PUBLIC_BASE_URL: ${OGAME_PUBLIC_BASE_URL:-http://localhost:${OGAME_SQLITE_PORT:-8891}}
      OGAME_SMTP_ENABLE: ${OGAME_SMTP_ENABLE:-0}
    ports:
      - "${OGAME_SQLITE_PORT:-8891}:8080"
    volumes:
      - sqlite_data:/srv/ogame/data
    networks:
      - default
      - mail_backend
    healthcheck: *go-healthcheck

  mysql:
    image: mysql:8.0
    command: [--skip-log-bin, --default-time-zone=+00:00]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
      MYSQL_DATABASE: ${OGAME_MDB_NAME:-master}
      TZ: UTC
    ports:
      - "${OGAME_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${OGAME_MAILHOG_PORT:-8026}:8025"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
      TZ: UTC
    ports:
      - "${OGAME_PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
  mail_backend:
    external: true

volumes:
  mysql_data:
  web_configs:
  sqlite_data:
    name: ${OGAME_SQLITE_VOLUME:-ogame-opensource_sqlite_data}
