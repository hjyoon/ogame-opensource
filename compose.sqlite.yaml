services:
  goapp-sqlite:
    build:
      context: .
      dockerfile: Dockerfile.golang
    environment:
      OGAME_ENV: ${OGAME_ENV:-development}
      OGAME_HTTP_ADDR: :8080
      OGAME_DB_DRIVER: sqlite
      OGAME_SQLITE_MASTER_PATH: /srv/ogame/data/master.sqlite
      OGAME_SQLITE_UNIVERSE_PATH: /srv/ogame/data/universe.sqlite
      OGAME_SQLITE_AUTO_MIGRATE: ${OGAME_SQLITE_AUTO_MIGRATE:-1}
      OGAME_UNI_DB_PREFIX: ${OGAME_UNI_DB_PREFIX:-uni1_}
      OGAME_UNI_DB_SECRET: ${OGAME_UNI_DB_SECRET:-sqlite-secret}
      OGAME_UNI_NUMBER: ${OGAME_UNI_NUMBER:-1}
      OGAME_ADMIN_EMAIL: ${OGAME_ADMIN_EMAIL:-admin@example.local}
      OGAME_ADMIN_PASSWORD: ${OGAME_ADMIN_PASSWORD:-admin}
      OGAME_PUBLIC_BASE_URL: ${OGAME_PUBLIC_BASE_URL:-http://localhost:${OGAME_SQLITE_PORT:-8891}}
      OGAME_LEGACY_BASE_URL: ${OGAME_LEGACY_BASE_URL:-http://localhost:8888}
      OGAME_SMTP_ENABLE: ${OGAME_SMTP_ENABLE:-0}
    ports:
      - "${OGAME_SQLITE_PORT:-8891}:8080"
    volumes:
      - sqlite_data:/srv/ogame/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  sqlite_data:
