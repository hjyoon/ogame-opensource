services:
  goapp:
    build:
      context: .
      dockerfile: Dockerfile.golang
    environment:
      OGAME_ENV: ${OGAME_ENV:-development}
      OGAME_HTTP_ADDR: :8080
      OGAME_LEGACY_BASE_URL: ${OGAME_LEGACY_BASE_URL:-http://localhost:8888}
      OGAME_LEGACY_GAME_DIR: ${OGAME_LEGACY_GAME_DIR:-/srv/ogame/game}
      OGAME_PUBLIC_BASE_URL: ${OGAME_PUBLIC_BASE_URL:-http://localhost:${OGAME_GO_PORT:-8890}}
      OGAME_PUBLIC_UNIVERSES: ${OGAME_PUBLIC_UNIVERSES:-}
      OGAME_MCP_OAUTH_REDIRECT_URIS: ${OGAME_MCP_OAUTH_REDIRECT_URIS:-}
      OGAME_MCP_OIDC_ED25519_SEED_B64: ${OGAME_MCP_OIDC_ED25519_SEED_B64:-}
      OGAME_MCP_OIDC_ED25519_PREVIOUS_SEEDS_B64: ${OGAME_MCP_OIDC_ED25519_PREVIOUS_SEEDS_B64:-}
      OGAME_MCP_RATE_LIMIT_ENABLE: ${OGAME_MCP_RATE_LIMIT_ENABLE:-}
      OGAME_MCP_RATE_LIMIT_PER_MINUTE: ${OGAME_MCP_RATE_LIMIT_PER_MINUTE:-}
      OGAME_MCP_RATE_LIMIT_BURST: ${OGAME_MCP_RATE_LIMIT_BURST:-}
      OGAME_SMTP_ENABLE: ${OGAME_SMTP_ENABLE:-1}
      OGAME_SMTP_ADDR: ${OGAME_SMTP_ADDR:-mailhog:1025}
      OGAME_SMTP_FROM: ${OGAME_SMTP_FROM:-OGame <noreply@localhost>}
      OGAME_MASTER_DB_ENABLE: ${OGAME_MASTER_DB_ENABLE:-1}
      OGAME_MDB_HOST: ${OGAME_MDB_HOST:-mysql}
      OGAME_MDB_USER: ${OGAME_MDB_USER:-root}
      OGAME_MDB_PASS: ${OGAME_MDB_PASS:-${MYSQL_ROOT_PASSWORD:-123}}
      OGAME_MDB_NAME: ${OGAME_MDB_NAME:-master}
      OGAME_UNI_DB_ENABLE: ${OGAME_UNI_DB_ENABLE:-1}
      OGAME_UNI_DB_HOST: ${OGAME_UNI_DB_HOST:-mysql}
      OGAME_UNI_DB_USER: ${OGAME_UNI_DB_USER:-root}
      OGAME_UNI_DB_PASS: ${OGAME_UNI_DB_PASS:-${MYSQL_ROOT_PASSWORD:-123}}
      OGAME_UNI_DB_NAME: ${OGAME_UNI_DB_NAME:-uni}
      OGAME_UNI_DB_PREFIX: ${OGAME_UNI_DB_PREFIX:-uni1_}
      OGAME_UNI_DB_SECRET: ${OGAME_UNI_DB_SECRET:-docker-secret}
      OGAME_UNI_NUMBER: ${OGAME_UNI_NUMBER:-1}
      OGAME_DB_MAX_OPEN_CONNS: ${OGAME_DB_MAX_OPEN_CONNS:-25}
      OGAME_DB_MAX_IDLE_CONNS: ${OGAME_DB_MAX_IDLE_CONNS:-5}
      OGAME_DB_CONN_MAX_LIFETIME_SECONDS: ${OGAME_DB_CONN_MAX_LIFETIME_SECONDS:-1800}
    ports:
      - "${OGAME_GO_PORT:-8890}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
      MYSQL_DATABASE: ${OGAME_MDB_NAME:-master}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${OGAME_MAILHOG_PORT:-8026}:8025"

volumes:
  mysql_data:
